<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Middle School Sports News – LES</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Serif+4:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2f6e;--gold:#c9a84c;--cream:#faf8f3;--ink:#1c1c1c;--win:#1a6e2f;--loss:#888}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-size:10pt}
.masthead{background:var(--navy);padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
.masthead h1{font-family:'Oswald',sans-serif;font-size:22pt;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff}
.masthead h1 span{color:var(--gold)}
.sub{font-size:7.5pt;color:#aac;text-align:right;line-height:1.6}
.gold-bar{height:4px;background:var(--gold)}
.meta-bar{display:flex;justify-content:space-between;padding:3px 16px;background:#f0f3fa;border-bottom:1px solid #ddd;font-size:7.5pt;color:var(--navy);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px}
.page{padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.league{border:1px solid #ddd;background:#fff;margin-bottom:10px;break-inside:avoid}
.league-hdr{background:var(--navy);color:#fff;padding:4px 10px;display:flex;justify-content:space-between;align-items:center}
.league-name{font-family:'Oswald',sans-serif;font-size:11pt;font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
.league-body{padding:6px 8px}
.sec-lbl{font-family:'Oswald',sans-serif;font-size:7pt;text-transform:uppercase;letter-spacing:2px;color:var(--gold);border-bottom:1px solid var(--gold);padding-bottom:3px;margin:7px 0 5px}
.sec-lbl:first-child{margin-top:0}
.game{display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;padding:3px 0;border-bottom:1px dotted #eee;font-size:8pt;gap:3px}
.game:last-child{border-bottom:none}
.t-away{text-align:right}
.t-name{font-family:'Oswald',sans-serif;font-size:8.5pt;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.t-rec{font-size:6.5pt;color:#aaa}
.t-win .t-name{color:var(--win)}.t-loss .t-name{color:var(--loss)}
.score{text-align:center}
.score-num{font-family:'Oswald',sans-serif;font-size:13pt;font-weight:700;color:var(--navy);line-height:1}
.score-status{display:block;font-size:6.5pt;color:#999}
.rundown{font-size:8.5pt;line-height:1.55;color:#333}
.watch{font-size:8pt;margin-top:4px;color:var(--navy);font-weight:600}
.hl{font-size:8pt;line-height:1.45;padding:3px 0;border-bottom:1px dotted #eee}
.hl:last-child{border-bottom:none}
.hl b{font-family:'Oswald',sans-serif;font-weight:600;font-size:8.5pt;color:var(--navy)}
.hl span{color:#555}
.off{font-size:8pt;color:#999;padding:4px 0}
.note{font-size:7pt;color:#a33;padding:2px 16px}
.spin-wrap{font-size:8pt;color:#999;padding:12px;text-align:center}
.footer{border-top:3px double var(--navy);padding:4px 16px;display:flex;justify-content:space-between;font-size:7pt;color:#666}
.footer a{color:#666}
@media print{body{background:#fff}.no-print{display:none}@page{margin:.5in;size:letter}}
</style>
</head>
<body>
<div class="masthead">
  <div>
    <h1>Middle School <span>Sports</span> News</h1>
    <div style="font-size:7.5pt;color:#aac;margin-top:2px">Your Daily Source for Local &amp; National Athletics</div>
  </div>
  <div class="sub">Lutheran Elementary School<br>Brooklyn, NY 11209<br><span id="hdr-date" style="color:var(--gold);font-weight:600"></span></div>
</div>
<div class="gold-bar"></div>
<div class="meta-bar">
  <span>🏈 NFL · 🏀 NBA · ⚾ MLB · 🏒 NHL</span>
  <span id="meta-date"></span>
  <span>New York Teams Featured</span>
</div>
<div id="note" class="note no-print"></div>
<div class="page">
  <div id="col-left"><div class="spin-wrap">Loading scores…</div></div>
  <div id="col-right"><div class="spin-wrap">Loading scores…</div></div>
</div>
<div class="footer">
  <span>Lutheran Elementary School · Brooklyn, NY 11209 · LES — The Key to Success</span>
  <span id="footer-date"></span>
  <span class="no-print"><a href="#" id="setkey">Set AI key</a></span>
</div>

<script>
async function pickModels(k){
  const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+k}});
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  const ids=(d.data||[]).map(m=>m.id).filter(i=>!/whisper|guard|tts|orpheus|embed|playai|safeguard/i.test(i));
  const first=[/llama-3\.3-70b/,/llama-3\.1-70b/,/qwen/,/llama-3\.1-8b/],o=[];
  first.forEach(p=>ids.forEach(i=>{if(p.test(i)&&!o.includes(i))o.push(i)}));
  ids.forEach(i=>{if(!o.includes(i))o.push(i)});
  return o.slice(0,3);
}

const ESPN='https://site.api.espn.com/apis/site/v2/sports';
const LEAGUES=[
  {k:'nfl',p:'football/nfl',i:'🏈',l:'NFL · Football'},
  {k:'nba',p:'basketball/nba',i:'🏀',l:'NBA · Basketball'},
  {k:'mlb',p:'baseball/mlb',i:'⚾',l:'MLB · Baseball'},
  {k:'nhl',p:'hockey/nhl',i:'🏒',l:'NHL · Hockey'}
];
const NY=['New York Giants','New York Jets','New York Yankees','New York Mets','New York Knicks','Brooklyn Nets','New York Rangers','New York Islanders','New Jersey Devils','Buffalo Bills'];
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const T=new Date();
const dateStr=`${WD[T.getDay()]}, ${MO[T.getMonth()]} ${T.getDate()}, ${T.getFullYear()}`;
['hdr-date','meta-date','footer-date'].forEach(id=>document.getElementById(id).textContent=dateStr);

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clip=(s,n)=>s&&s.length>n?s.slice(0,n).replace(/\s+\S*$/,'')+'…':(s||'');
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const shift=n=>{const d=new Date(T);d.setDate(d.getDate()+n);return d};
const showNote=m=>{const n=document.getElementById('note');n.textContent=(n.textContent?n.textContent+' · ':'')+m};

function getKey(){
  try{
    const u=new URLSearchParams(location.search).get('key');
    if(u&&u.startsWith('gsk_')){localStorage.setItem('groq_api_key',u);history.replaceState(null,'',location.pathname)}
    return localStorage.getItem('groq_api_key');
  }catch(e){return null}
}
document.getElementById('setkey').onclick=e=>{
  e.preventDefault();
  const k=prompt('Groq API key (starts with gsk_):');
  if(k&&k.trim().startsWith('gsk_')){localStorage.setItem('groq_api_key',k.trim());location.reload()}
};

async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
const fmtDay=iso=>iso?new Date(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'';

function parts(e){
  const c=(e.competitions||[{}])[0]?.competitors||[];
  const away=c.find(x=>x.homeAway==='away')||c[0]||{},home=c.find(x=>x.homeAway==='home')||c[1]||{};
  return{away,home,isNY:[away,home].some(x=>NY.includes(x.team?.displayName))}
}

function validEvents(sc){
  const minTime=shift(-3).setHours(0,0,0,0);
  const maxTime=shift(2).setHours(23,59,59,999);
  return (sc.events||[]).filter(e=>{
    if(!e.date)return false;
    const t=new Date(e.date).getTime();
    const sType=e.season?.type; // 2 = Regular Season, 3 = Postseason
    return !isNaN(t)&&t>=minTime&&t<=maxTime&&(sType===2||sType===3);
  });
}

function pickDisplayedGames(evList){
  const sortNY=(a,b)=>(parts(b).isNY-parts(a).isNY);
  return{
    live:evList.filter(e=>e.status?.type?.state==='in').sort(sortNY).slice(0,2),
    fin:evList.filter(e=>e.status?.type?.completed).sort((a,b)=>sortNY(a,b)||new Date(b.date)-new Date(a.date)).slice(0,4),
    up:evList.filter(e=>e.status?.type?.state==='pre').sort((a,b)=>sortNY(a,b)||new Date(a.date)-new Date(b.date)).slice(0,3)
  };
}

function gameRow(e){
  const{away,home}=parts(e),st=e.status?.type?.state;
  const a=parseInt(away.score),h=parseInt(home.score),has=st!=='pre'&&!isNaN(a)&&!isNaN(h);
  const status=st==='in'?(e.status?.type?.shortDetail||'Live'):st==='pre'?fmtDay(e.date):'Final · '+fmtDay(e.date);
  const side=(t,win,cls)=>`<div class="${cls} ${has?(win?'t-win':'t-loss'):''}"><div class="t-name">${esc(t.team?.shortDisplayName||t.team?.displayName||'—')}</div>${t.records?.[0]?.summary?`<div class="t-rec">${esc(t.records[0].summary)}</div>`:''}</div>`;
  return `<div class="game">${side(away,a>h,'t-away')}<div class="score">${has?`<div class="score-num">${a}–${h}</div>`:'<div class="score-num" style="font-size:9pt;color:#aaa">vs</div>'}<span class="score-status">${esc(status)}</span></div>${side(home,h>a,'t-home')}</div>`
}

function summarize(pk,nw){
  const fin=pk.fin.map(e=>{
    const{away,home}=parts(e);
    const a=parseInt(away.score),h=parseInt(home.score);
    const aName=away.team?.displayName,hName=home.team?.displayName;
    if(a>h)return `${aName} defeated ${hName} ${a}-${h} (${fmtDay(e.date)})`;
    if(h>a)return `${hName} defeated ${aName} ${h}-${a} (${fmtDay(e.date)})`;
    return `${aName} tied ${hName} ${a}-${h}`;
  }).join(' | ')||'None';

  const live=pk.live.map(e=>{
    const{away,home}=parts(e);
    return `${away.team?.displayName} ${away.score} vs ${home.team?.displayName} ${home.score} (In Progress)`;
  }).join(' | ')||'None';

  const up=pk.up.map(e=>{
    const{away,home}=parts(e);
    return `${away.team?.displayName} at ${home.team?.displayName} (${fmtDay(e.date)})`;
  }).join(' | ')||'None';

  const h=(nw.articles||[]).slice(0,5).map(a=>a.headline+(a.description?' ('+clip(a.description,110)+')':'')).join(' | ')||'No news';
  return{live,fin,up,h};
}

async function askAI(data){
  const k=getKey();if(!k)throw new Error('No AI key saved on this device (use "Set AI key" at the bottom).');
  const body=LEAGUES.map(l=>`=== ${l.k.toUpperCase()} ===\nLive Games: ${data[l.k].live}\nCompleted Games: ${data[l.k].fin}\nUpcoming Games: ${data[l.k].up}\nHeadlines: ${data[l.k].h}`).join('\n\n');
  const prompt=`Today is ${dateStr}. You write for a middle school sports page (ages 11-14) at Lutheran Elementary School in Brooklyn. Students follow NY teams (Giants, Jets, Bills, Yankees, Mets, Knicks, Nets, Rangers, Islanders, Devils).

STRICT RULES:
1. ONLY mention game scores, winners, and matchups explicitly listed in the data below. NEVER invent scores, games, or playoff clinches.
2. If "Live Games", "Completed Games", and "Upcoming Games" are all "None", explicitly state the league is in its off-season and summarize ONLY the headlines.
3. For each league write:
   - "rundown": 2-3 upbeat, accurate sentences summarizing the real results, upcoming matchups, and headlines (highlighting NY teams if they appear in the data).
   - "watch": 1 sentence on a team or player to watch based strictly on the provided data.

DATA:
${body}

Return valid JSON only: {"nfl":{"rundown":"","watch":""},"nba":{"rundown":"","watch":""},"mlb":{"rundown":"","watch":""},"nhl":{"rundown":"","watch":""}}`;

  let err;
  for(const m of await pickModels(k)){
    try{
      const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},
        body:JSON.stringify({
          model:m,
          temperature:0.2,
          max_tokens:1500,
          ...(/gpt-oss/.test(m)?{reasoning_effort:'low'}:{}),
          messages:[
            {role:'system',content:'You are a factual middle school sports writer. Never fabricate scores or teams not in the prompt. Reply with JSON only.'},
            {role:'user',content:prompt}
          ]
        })
      });
      const d=await r.json();if(d.error)throw new Error(d.error.message);
      const t=d.choices[0].message.content;
      return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
    }catch(e){err=new Error((err?err.message+' | ':'')+m+': '+e.message)}
  }
  throw err;
}

function buildLeague(lg,pk,nw,ai){
  const{live,fin,up}=pk;
  let h=`<div class="league"><div class="league-hdr"><span class="league-name">${lg.l}</span><span style="font-size:14pt">${lg.i}</span></div><div class="league-body">`;
  if(ai?.rundown)h+=`<div class="rundown">${esc(ai.rundown)}</div>${ai.watch?`<div class="watch">👀 ${esc(ai.watch)}</div>`:''}`;
  if(live.length)h+=`<div class="sec-lbl">Live Now</div>`+live.map(gameRow).join('');
  if(fin.length)h+=`<div class="sec-lbl">Recent Scores</div>`+fin.map(gameRow).join('');
  if(up.length)h+=`<div class="sec-lbl">Coming Up</div>`+up.map(gameRow).join('');
  if(!live.length&&!fin.length&&!up.length)h+=`<div class="off">No games scheduled — currently in the off-season.</div>`;
  const arts=(nw.articles||[]).filter(a=>a.headline).slice(0,3);
  if(arts.length)h+=`<div class="sec-lbl">Top Stories</div>`+arts.map(a=>`<div class="hl"><b>${esc(a.headline)}</b>${a.description?`<br><span>${esc(clip(a.description,150))}</span>`:''}</div>`).join('');
  return h+'</div></div>';
}

async function loadAll(){
  const datesToFetch=[ymd(shift(-2)),ymd(shift(-1)),ymd(T),ymd(shift(1))];
  const nw={},picked={},sum={};

  await Promise.all(LEAGUES.map(async l=>{
    const [dayResults,newsRes]=await Promise.all([
      Promise.allSettled(datesToFetch.map(d=>getJSON(`${ESPN}/${l.p}/scoreboard?dates=${d}`))),
      getJSON(`${ESPN}/${l.p}/news?limit=6`).catch(()=>({articles:[]}))
    ]);
    const seen=new Set();
    const merged=[];
    dayResults.forEach(r=>{
      if(r.status==='fulfilled'){
        (r.value.events||[]).forEach(e=>{
          if(!seen.has(e.id)){seen.add(e.id);merged.push(e)}
        });
      }
    });
    const valid=validEvents({events:merged});
    picked[l.k]=pickDisplayedGames(valid);
    nw[l.k]=newsRes;
    sum[l.k]=summarize(picked[l.k],nw[l.k]);
  }));

  const draw=ai=>{
    const b=k=>buildLeague(LEAGUES.find(l=>l.k===k),picked[k],nw[k],ai?.[k]);
    document.getElementById('col-left').innerHTML=b('nfl')+b('mlb');
    document.getElementById('col-right').innerHTML=b('nba')+b('nhl');
  };
  draw(null);
  try{draw(await askAI(sum))}catch(e){console.error(e);showNote('AI summaries unavailable: '+e.message)}
}
loadAll();
</script>
</body>
</html>
