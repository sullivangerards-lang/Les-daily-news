<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Middle School Messenger – LES</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1a2f6e; --gold:#c9a84c; --cream:#faf8f3; --ink:#1c1c1c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:'Source Serif 4',Georgia,serif; font-size:10pt; line-height:1.5; }

  .masthead { border-top:4px solid var(--navy); border-bottom:4px solid var(--navy); padding:8px 16px 6px; text-align:center; }
  .masthead-top { display:flex; justify-content:space-between; font-size:7.5pt; color:var(--navy); margin-bottom:2px; }
  .masthead h1 { font-family:'UnifrakturMaguntia',cursive; font-size:38pt; color:var(--navy); line-height:1; }
  .masthead .tagline { font-family:'Playfair Display',serif; font-style:italic; font-size:8.5pt; color:#555; letter-spacing:3px; text-transform:uppercase; margin-top:2px; }
  .rule-gold { height:2px; background:var(--gold); margin:4px 0; }

  .meta-bar { display:flex; justify-content:space-between; padding:4px 16px; background:var(--navy); color:white; font-size:7.5pt; }

  .page { padding:10px 16px; display:grid; grid-template-columns:1fr 2px 1fr 2px 1fr; }
  .col-divider { background:var(--navy); margin:0 8px; opacity:0.2; }
  .col { padding:0 6px; }

  .section-head { font-family:'Playfair Display',serif; font-size:8pt; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:var(--navy); border-bottom:1.5px solid var(--navy); padding-bottom:2px; margin-bottom:5px; margin-top:8px; }
  .section-head:first-child { margin-top:0; }

  .story { margin-bottom:8px; }
  .story-headline { font-family:'Playfair Display',serif; font-size:10.5pt; font-weight:700; line-height:1.2; margin-bottom:2px; }
  .story-headline.lg { font-size:13pt; }
  .story-body { font-size:8.5pt; line-height:1.55; color:#2a2a2a; text-align:justify; hyphens:auto; }
  hr.div { border:none; border-top:1px solid #ddd; margin:6px 0; }

  .weather-box { border:1.5px solid var(--navy); padding:6px 8px; margin-bottom:8px; background:white; }
  .w-location { font-size:7pt; text-transform:uppercase; letter-spacing:1.5px; color:#888; margin-bottom:2px; }
  .w-main { font-family:'Playfair Display',serif; font-size:18pt; font-weight:700; color:var(--navy); line-height:1; }
  .w-desc { font-size:8pt; color:#555; margin-top:2px; }
